<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TCOS — Registration Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
<style>
/* ─── Design tokens ──────────────────────── */
:root {
  /* Page */
  --page:        #F5F0EB;
  --surface:     #FFFFFF;
  --surface2:    #FAF7F4;
  --surface3:    #F0EBE4;

  /* Brand red */
  --red:         #C42020;
  --red-dark:    #7A1212;
  --red-mid:     #D93030;
  --red-tint:    #FBF0F0;
  --red-border:  #F0CBCB;

  /* Stage gold */
  --gold:        #9A6520;
  --gold-mid:    #B97B30;
  --gold-light:  #F5DDB0;
  --gold-tint:   #FBF5E8;
  --gold-border: #E8D0A0;

  /* Text */
  --ink:         #1E1A16;
  --ink-mid:     #4A4540;
  --ink-light:   #7A736B;
  --ink-hint:    #B0A898;

  /* Status */
  --green:       #2E7D32; --green-tint: #EDF7EE; --green-border: #B8DDB9;
  --amber:       #8A6000; --amber-tint: #FFF8E8; --amber-border: #E8D090;
  --blue:        #1A5FA0; --blue-tint:  #EEF4FB; --blue-border:  #B8D0ED;
  --rust:        #A03020; --rust-tint:  #FBF0EE; --rust-border:  #E8C0B8;

  /* Borders */
  --border:      #E8E2DA;
  --border2:     #D8D0C6;

  font-family: 'Inter', sans-serif;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--page);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

/* ─── Dev toggle ──────────────────────────── */
#devToggle {
  position: fixed; bottom: 1.25rem; right: 1.25rem; z-index: 9999;
  background: var(--red); color: #fff; border: none;
  padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; box-shadow: 0 4px 16px rgba(196,32,32,.3);
  font-family: 'Inter', sans-serif; transition: background .2s;
  display: flex; align-items: center; gap: 6px;
}
#devToggle:hover { background: var(--red-dark); }
#devBadge {
  background: rgba(255,255,255,.25); padding: 1px 6px;
  border-radius: 4px; font-size: 10px;
}

/* ══════════════════════════════════════════
   NAV
══════════════════════════════════════════ */
.nav {
  position: sticky; top: 0; z-index: 100; height: 56px;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo-mark {
  width: 34px; height: 34px; border-radius: 7px;
  background: linear-gradient(135deg, var(--red-dark), var(--red-mid));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 15px;
  font-weight: 700; color: var(--gold-light); flex-shrink: 0;
}
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-weight: 600; color: var(--ink);
  letter-spacing: .02em;
}
.nav-brand span { color: var(--red); }
.nav-right { display: flex; align-items: center; gap: 8px; }

/* ─── Buttons ──────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--surface);
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--ink-mid); cursor: pointer; transition: all .16s;
  text-decoration: none;
}
.btn:hover { background: var(--surface3); border-color: var(--border2); color: var(--ink); }

.btn-primary {
  background: var(--red); color: #fff; border-color: var(--red);
}
.btn-primary:hover { background: var(--red-dark); color: #fff; border-color: var(--red-dark); }

.btn-gold {
  background: var(--gold); color: #fff; border-color: var(--gold);
  font-weight: 600;
}
.btn-gold:hover { background: var(--gold-mid); color: #fff; }

.btn-block { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }

.btn-ghost {
  background: transparent; border-color: var(--border);
  color: var(--ink-light);
}
.btn-ghost:hover { background: var(--surface3); color: var(--ink); }

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.app-main {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: calc(100vh - 56px);
}

.left-panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.1rem;
  overflow-y: auto;
  position: sticky; top: 56px;
  height: calc(100vh - 56px);
  display: flex; flex-direction: column; gap: .85rem;
}

.right-panel {
  padding: 1.25rem;
  overflow-y: auto;
}

/* ─── Section label ──────────────────────── */
.slabel {
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-hint);
  margin-bottom: .5rem; display: flex; align-items: center; gap: 5px;
}
.slabel i { color: var(--gold); font-size: 12px; }

/* ══════════════════════════════════════════
   USER CARD
══════════════════════════════════════════ */
.user-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 1rem;
  position: relative; overflow: hidden;
}
.user-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  
}
.user-avatar-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .7rem; }
.user-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-mid) 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 18px;
  font-weight: 700; color: #fff; flex-shrink: 0;
}
.user-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-weight: 600; color: var(--ink);
  margin-bottom: 1px; line-height: 1.2;
}
.user-nick { font-size: 11px; color: var(--ink-light); }
.user-meta { display: flex; flex-direction: column; gap: 4px; }
.user-meta-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-mid); }
.user-meta-row i { font-size: 13px; color: var(--gold); }
.user-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: .65rem; }
.tag {
  font-size: 10px; padding: 2px 8px; border-radius: 20px;
  background: var(--gold-tint); color: var(--gold);
  border: 1px solid var(--gold-border);
}

/* ══════════════════════════════════════════
   GUEST PANEL
══════════════════════════════════════════ */
.guest-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1rem;
  position: relative; overflow: hidden;
}
.guest-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.guest-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 600; color: var(--ink);
  margin-bottom: 3px;
}
.guest-sub { font-size: 12px; color: var(--ink-light); margin-bottom: .85rem; line-height: 1.55; }

.tabs-mini { display: flex; gap: 4px; margin-bottom: .85rem; }
.tab-mini {
  flex: 1; padding: 6px; border-radius: 6px; text-align: center;
  font-size: 12px; font-weight: 500; cursor: pointer;
  background: var(--surface3); color: var(--ink-light);
  border: 1px solid var(--border); transition: all .15s;
}
.tab-mini.active {
  background: var(--red); color: #fff; border-color: var(--red);
}

/* ─── Forms ────────────────────────────────── */
.mini-form { display: flex; flex-direction: column; gap: .45rem; }
.form-label { font-size: 11px; color: var(--ink-mid); margin-bottom: 2px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%; border: 1px solid var(--border2);
  background: var(--surface); border-radius: 6px;
  padding: 7px 10px; font-size: 13px;
  font-family: 'Inter', sans-serif; color: var(--ink);
  outline: none; transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-input::placeholder { color: var(--ink-hint); }
.form-input[readonly] { background: var(--surface3); color: var(--ink-light); cursor: default; }
.form-textarea { resize: none; height: 68px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
.form-group { display: flex; flex-direction: column; gap: 3px; }
.form-group.full { grid-column: 1/-1; }

/* ── Guest perks teaser ──────────────────── */
.perk-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--ink-mid); margin-bottom: .4rem;
}
.perk-item i { color: var(--gold); font-size: 14px; flex-shrink: 0; }

/* ══════════════════════════════════════════
   QR CARD
══════════════════════════════════════════ */
.qr-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: .9rem; text-align: center;
}
.qr-box {
  width: 92px; height: 92px; margin: 0 auto .5rem;
  background: #fff; border-radius: 6px; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.qr-box svg { width: 80px; height: 80px; }
.qr-id { font-size: 10px; color: var(--ink-hint); font-family: monospace; margin-bottom: .45rem; }
.btn-qr {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border2); background: var(--surface);
  padding: 4px 11px; border-radius: 6px; font-size: 11px;
  cursor: pointer; color: var(--ink-mid);
  font-family: 'Inter', sans-serif; transition: all .15s;
}
.btn-qr:hover { background: var(--surface3); color: var(--ink); }

/* ══════════════════════════════════════════
   MY EVENTS
══════════════════════════════════════════ */
.my-events { display: flex; flex-direction: column; gap: .38rem; }
.my-event-item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: .6rem .7rem; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; background: var(--surface);
  transition: all .15s;
}
.my-event-item:hover { border-color: var(--border2); background: var(--surface2); }
.sdot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.sdot-up { background: var(--gold-mid); }
.sdot-ok { background: var(--green); }
.sdot-no { background: var(--rust); }
.mei-info { flex: 1; min-width: 0; }
.mei-name {
  font-size: 12px; font-weight: 500; color: var(--ink);
  margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mei-date { font-size: 11px; color: var(--ink-light); }
.sbadge {
  font-size: 10px; padding: 2px 6px; border-radius: 20px;
  flex-shrink: 0; white-space: nowrap; border: 1px solid;
}
.sbadge-up { background: var(--amber-tint); color: var(--amber); border-color: var(--amber-border); }
.sbadge-ok { background: var(--green-tint); color: var(--green); border-color: var(--green-border); }
.sbadge-no { background: var(--rust-tint);  color: var(--rust);  border-color: var(--rust-border);  }

/* ══════════════════════════════════════════
   HERO BANNER
══════════════════════════════════════════ */
.hero-banner {
  border-radius: 14px; overflow: hidden; margin-bottom: 1.1rem;
  position: relative; height: 152px;
  display: flex; align-items: flex-end; padding: 1.15rem;
  cursor: pointer; border: 1px solid var(--border);
}
.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(120deg, #2A0808 0%, #6A1010 45%, #B82020 80%, #D93030 100%);
}
.hero-curtain-l, .hero-curtain-r {
  position: absolute; top: 0; bottom: 0; width: 80px;
  background: linear-gradient(135deg, #7A1212, #3A0808);
  opacity: .9;
}
.hero-curtain-l { left: 0; clip-path: polygon(0 0,100% 0,65% 100%,0 100%); }
.hero-curtain-r { right: 0; clip-path: polygon(35% 0,100% 0,100% 100%,0 100%); }
.hero-glow {
  position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
  width: 260px; height: 190px;
  background: radial-gradient(ellipse at top, rgba(245,221,176,.15) 0%, transparent 65%);
}
.hero-content { position: relative; z-index: 1; }
.hero-eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--gold-light);
  margin-bottom: .3rem; display: flex; align-items: center; gap: 5px;
}
.hero-eyebrow i { font-size: 11px; }
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; font-weight: 700; color: #fff;
  line-height: 1.15; margin-bottom: .35rem;
}
.hero-title em { color: var(--gold-light); font-style: italic; }
.hero-meta { font-size: 12px; color: rgba(255,255,255,.6); display: flex; gap: 14px; flex-wrap: wrap; }
.hero-meta span { display: flex; align-items: center; gap: 4px; }
.hero-meta i { font-size: 12px; color: var(--gold-light); }
.hero-price-tag {
  position: absolute; right: 1.15rem; top: 50%; transform: translateY(-50%); z-index: 1;
  text-align: center; background: rgba(0,0,0,.35); border-radius: 8px;
  padding: .5rem .75rem; border: 1px solid rgba(245,221,176,.25);
}
.hero-price-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 700; color: var(--gold-light); line-height: 1;
}
.hero-price-sub { font-size: 10px; color: rgba(255,255,255,.5); }

/* ─── Banner strip ────────────────────────── */
.banner-strip {
  display: flex; gap: .65rem; overflow-x: auto; padding-bottom: 4px;
  margin-bottom: 1.1rem;
}
.banner-strip::-webkit-scrollbar { height: 3px; }
.banner-card {
  flex-shrink: 0; width: 176px; height: 76px;
  border-radius: 10px; overflow: hidden; cursor: pointer;
  border: 1px solid var(--border); transition: transform .2s;
  position: relative; display: flex; align-items: center; justify-content: center;
}
.banner-card:hover { transform: scale(1.02); }
.banner-inner {
  width: 100%; height: 100%; display: flex; flex-direction: column;
  align-items: flex-start; justify-content: flex-end; padding: .6rem;
}
.bc1 { background: linear-gradient(135deg, #F5EDE0, #E8D5B8); }
.bc2 { background: linear-gradient(135deg, #EAF2E8, #C8DFC5); }
.bc3 { background: linear-gradient(135deg, #E8EEF8, #C0CFE8); }
.bc4 { background: linear-gradient(135deg, #F5F0E0, #E8D890); }
.banner-label {
  font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.25;
  font-family: 'Cormorant Garamond', serif;
}
.banner-tag {
  font-size: 9px; font-weight: 600; padding: 2px 6px;
  border-radius: 4px; background: rgba(0,0,0,.12); color: var(--ink-mid);
  margin-bottom: 3px; display: inline-block;
}

/* ─── Section heading ─────────────────────── */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .75rem; }
.sec-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px; font-weight: 600; color: var(--ink);
}
.sec-title em { color: var(--red); font-style: italic; }

/* ─── Filter bar ──────────────────────────── */
.filter-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: .9rem; }
.filter-btn {
  border: 1px solid var(--border2); background: var(--surface);
  padding: 4px 13px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; color: var(--ink-light); font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); }
.filter-btn:hover:not(.active) { background: var(--surface3); color: var(--ink); }

/* ══════════════════════════════════════════
   RECOMMENDED STRIP
══════════════════════════════════════════ */
.rec-strip {
  display: flex; gap: .65rem; overflow-x: auto; padding-bottom: 4px; margin-bottom: 1.1rem;
}
.rec-strip::-webkit-scrollbar { height: 3px; }
.rec-card {
  flex-shrink: 0; width: 190px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; overflow: hidden; cursor: pointer; transition: all .2s;
}
.rec-card:hover { border-color: var(--gold-border); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.rec-poster {
  height: 100px; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.rec-poster-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.18); font-size: 18px;
}
.rec-poster-icon i { font-size: 20px; color: rgba(255,255,255,.85); }
.rec-hot {
  position: absolute; top: 7px; right: 7px;
  font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
  background: var(--red); color: #fff;
}
.rec-body { padding: .6rem; }
.rec-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; font-weight: 600; color: var(--ink);
  margin-bottom: 2px; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rec-sub { font-size: 10px; color: var(--ink-light); }

/* ══════════════════════════════════════════
   EVENT GRID
══════════════════════════════════════════ */
.events-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(215px,1fr)); gap: .85rem;
}
.event-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; cursor: pointer;
  transition: all .2s;
}
.event-card:hover {
  border-color: var(--border2); transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.07);
}

/* Poster gradients — muted, warm */
.event-poster {
  height: 126px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.poster-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
}
.poster-icon i { font-size: 24px; color: rgba(255,255,255,.8); }
.p1 { background: linear-gradient(135deg, #5A1010 0%, #A02020 100%); }
.p2 { background: linear-gradient(135deg, #0E3020 0%, #1A5535 100%); }
.p3 { background: linear-gradient(135deg, #1A1030 0%, #3A2060 100%); }
.p4 { background: linear-gradient(135deg, #0A1830 0%, #1A3060 100%); }
.p5 { background: linear-gradient(135deg, #402000 0%, #7A4010 100%); }
.p6 { background: linear-gradient(135deg, #3A000C 0%, #780018 100%); }
.p7 { background: linear-gradient(135deg, #00282A 0%, #005055 100%); }

.ev-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
  border: 1px solid;
}
.eb-free { background: var(--green-tint); color: var(--green); border-color: var(--green-border); }
.eb-paid { background: var(--amber-tint); color: var(--amber); border-color: var(--amber-border); }
.eb-full { background: var(--rust-tint);  color: var(--rust);  border-color: var(--rust-border);  }

.event-body { padding: .78rem; }
.event-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; font-weight: 600; color: var(--ink);
  line-height: 1.3; margin-bottom: .4rem;
}
.event-meta { display: flex; flex-direction: column; gap: 3px; margin-bottom: .6rem; }
.emr { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-light); }
.emr i { font-size: 12px; color: var(--gold); }
.event-footer { display: flex; align-items: center; gap: 8px; }
.seat-wrap { flex: 1; }
.seat-label { font-size: 10px; color: var(--ink-hint); margin-bottom: 3px; }
.seat-bar { height: 3px; background: var(--surface3); border-radius: 2px; overflow: hidden; }
.seat-fill { height: 100%; border-radius: 2px; background: var(--gold-mid); }
.seat-fill-hi { background: var(--rust); }

.btn-reg {
  border: 1px solid var(--border2); background: transparent;
  padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 500;
  cursor: pointer; color: var(--ink-light);
  font-family: 'Inter', sans-serif; white-space: nowrap; transition: all .15s;
}
.btn-reg:hover { background: var(--red); color: #fff; border-color: var(--red); }
.btn-reg-done { background: var(--green-tint); color: var(--green); border: 1px solid var(--green-border); cursor: default; }
.btn-reg-done:hover { background: var(--green-tint); color: var(--green); }

.modal-overlay {

}
.modal-poster-icon {
  width: 56px; height: 56px; border-radius: 12px;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
}
.modal-poster-icon i { font-size: 30px; color: rgba(255,255,255,.85); }
.modal-close {
  position: absolute; top: 12px; right: 12px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,.4); border: none; cursor: pointer;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: background .15s;
}
.modal-close:hover { background: var(--red); }
.modal-pills {
  position: absolute; bottom: 10px; left: 12px; display: flex; gap: 5px;
}
.mpill {
  font-size: 11px; padding: 3px 8px; border-radius: 5px;

}

.modal-body { padding: 1.35rem; }

.modal-desc { font-size: 13px; color: var(--ink-mid); line-height: 1.65; margin-bottom: 1.1rem; }

.modal-stats {

.stat-card {
  background: var(--surface2); border: 1px solid var(--border);

.stat-val { font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 1px; }

.msection { margin-bottom: 1rem; }
.msection-title {
  font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;

}

.sched-row {

.info-banner {

.ib-gold  { background: var(--gold-tint);  color: var(--gold);  border-color: var(--gold-border);  }

.pay-tabs { display: flex; gap: 4px; margin-bottom: .6rem; }

/* ── Events grid ────────────────────────── */
function renderEvents(filter) {
  const list = filter === 'all' ? EVENTS
    : filter === 'เข้าฟรี' ? EVENTS.filter(e => e.free)
    : EVENTS.filter(e => e.cat === filter);

  document.getElementById('eventsGrid').innerHTML = list.map(e => {
    const idx = EVENTS.indexOf(e);
    const pct = Math.round(e.registered / e.seats * 100);
    const isFull = e.registered >= e.seats;
    const badge = e.free ? `<span class="ev-badge eb-free">ฟรี</span>`
      : isFull ? `<span class="ev-badge eb-full">เต็ม</span>`
      : `<span class="ev-badge eb-paid">฿${e.price}</span>`;
    const btn = e.myEvent
      ? `<button class="btn-reg btn-reg-done" disabled><i class="ti ti-check"></i> ลงทะเบียนแล้ว</button>`
      : isFull ? `<button class="btn-reg btn-reg-full" disabled>เต็มแล้ว</button>`
      : `<button class="btn-reg" onclick="event.stopPropagation();openEvent(${idx})">ลงทะเบียน</button>`;
    return `
    <div class="event-card" onclick="openEvent(${idx})" tabindex="0" role="button">
      <div class="event-poster ${e.pClass}">
        <div class="poster-icon"><i class="ti ${e.icon}"></i></div>
        ${badge}
      </div>
      <div class="event-body">
        <div class="event-title">${e.title}</div>
        <div class="event-meta">
          <div class="emr"><i class="ti ti-calendar"></i>${e.date}</div>
          <div class="emr"><i class="ti ti-clock"></i>${e.time}</div>
          <div class="emr"><i class="ti ti-map-pin"></i>${e.venue}</div>
        </div>
        <div class="event-footer">
          <div class="seat-wrap">
            <div class="seat-label">${e.registered}/${e.seats} ที่นั่ง</div>
            <div class="seat-bar"><div class="${pct > 80 ? 'seat-fill seat-fill-hi' : 'seat-fill'}" style="width:${pct}%"></div></div>
          </div>
          ${btn}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── Payment section ────────────────────── */
function buildPay(e) {
  if (e.free) return '';
  return `
    <div style="margin-bottom:.6rem">
      <label class="form-label" style="margin-bottom:.4rem">วิธีชำระเงิน (฿${e.price})</label>
      <div class="pay-tabs">
        <div class="pay-tab active" id="pt-promptpay" onclick="switchPay('promptpay')">
          <i class="ti ti-qrcode"></i> PromptPay
        </div>
        <div class="pay-tab" id="pt-card" onclick="switchPay('card')">
          <i class="ti ti-credit-card"></i> บัตรเครดิต
        </div>
        <div class="pay-tab" id="pt-cash" onclick="switchPay('cash')">
          <i class="ti ti-cash"></i> เงินสด
        </div>
      </div>
      <div id="payContent">${renderPayContent('promptpay', e.price)}</div>
    </div>`;
}

function switchPay(mode) {
  activePayMode = mode;
  document.querySelectorAll('.pay-tab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('pt-' + mode);
  if (tab) tab.classList.add('active');
  const pc = document.getElementById('payContent');
  if (pc) pc.innerHTML = renderPayContent(mode, EVENTS[currentIdx].price);
}

function renderPayContent(mode, price) {
  if (mode === 'promptpay') return `
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.75rem;text-align:center;margin-bottom:.5rem">
      <div style="font-size:11px;color:var(--ink-mid);margin-bottom:.5rem">สแกน QR เพื่อโอน ฿${price}</div>
      <div style="width:76px;height:76px;background:#fff;border:1px solid var(--border);border-radius:6px;margin:0 auto .45rem;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-light)">QR Code</div>
      <div style="font-size:10px;color:var(--ink-hint)">PromptPay: 062-345-6789 (TCOS)</div>
    </div>
    <label class="form-label">อัพโหลดสลิปการโอน</label>
    <div class="slip-upload" onclick="document.getElementById('slipInput').click()"
         ondragover="event.preventDefault();this.style.borderColor='var(--gold)'"
         ondragleave="this.style.borderColor=''"
         ondrop="handleDrop(event)">
      <i class="ti ti-upload"></i>
      <div class="slip-text">คลิกหรือลากไฟล์สลิปมาวาง</div>
      <div class="slip-hint">PNG, JPG, PDF — ไม่เกิน 5MB</div>
    </div>
    <input type="file" id="slipInput" accept="image/*,.pdf" style="display:none" onchange="previewSlip(this)">
    <div class="slip-preview" id="slipPreview"><img id="slipImg" src="" alt="slip preview"></div>`;

  if (mode === 'card') return `
    <div class="form-group" style="margin-bottom:.45rem">
      <label class="form-label">หมายเลขบัตร</label>
      <input class="form-input" placeholder="0000 0000 0000 0000" maxlength="19">
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">วันหมดอายุ</label><input class="form-input" placeholder="MM/YY" maxlength="5"></div>
      <div class="form-group"><label class="form-label">CVV</label><input class="form-input" placeholder="123" maxlength="3" type="password"></div>
    </div>
    <div class="form-group" style="margin-top:.45rem">
      <label class="form-label">ชื่อบนบัตร</label>
      <input class="form-input" placeholder="ชื่อภาษาอังกฤษตามบัตร">
    </div>`;

  return `
    <div class="info-banner ib-gold" style="margin-bottom:.45rem">
      <i class="ti ti-cash"></i>
      <div>ชำระเงินสดได้ที่จุดลงทะเบียนหน้างาน<br>
      <span style="font-size:10px;opacity:.8">กรุณานำ QR Code มาแสดงเพื่อยืนยันที่นั่ง</span></div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.65rem">
      <div style="font-size:10px;color:var(--ink-hint);margin-bottom:2px">จุดรับชำระเงิน</div>
      <div style="font-size:13px;font-weight:500;color:var(--ink)">Counter TCOS — ประตู A ชั้น 1</div>
      <div style="font-size:11px;color:var(--ink-light);margin-top:2px">เปิด 1 ชั่วโมงก่อนงานเริ่ม</div>
    </div>`;
}

function previewSlip(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const p = document.getElementById('slipPreview');
    const i = document.getElementById('slipImg');
    if (p && i) { i.src = ev.target.result; p.style.display = 'block'; }
  };
  reader.readAsDataURL(input.files[0]);
}

function handleDrop(e) {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const inp = document.getElementById('slipInput');
  if (inp) { try { const dt = new DataTransfer(); dt.items.add(f); inp.files = dt.files; previewSlip(inp); } catch(_) {} }
  e.currentTarget.style.borderColor = '';
}

/* ── Auth modal ─────────────────────────── */
function openAuthModal(tab) {
  document.getElementById('eventModalContent').innerHTML = `
    <div style="padding:1.2rem 1.35rem .7rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)">
      <div style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ink)">TCOS Account</div>
      <button class="modal-close" style="position:static;background:var(--surface3);color:var(--ink-mid)" onclick="closeModal('eventModal')"><i class="ti ti-x"></i></button>
    </div>
    <div style="padding:1.2rem 1.35rem">
      <div class="tabs-mini" style="margin-bottom:1rem">
        <div class="tab-mini ${tab==='login'?'active':''}" onclick="switchAuthTab(this,'login')">เข้าสู่ระบบ</div>
        <div class="tab-mini ${tab==='register'?'active':''}" onclick="switchAuthTab(this,'register')">สมัครสมาชิก</div>
      </div>
      <div id="authFormWrap"></div>
    </div>`;
  renderAuthForm(tab);
  document.getElementById('eventModal').classList.add('open');
}

function switchAuthTab(el, tab) {
  document.querySelectorAll('#eventModalContent .tab-mini').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAuthForm(tab);
}

function renderAuthForm(tab) {
  const w = document.getElementById('authFormWrap');
  if (!w) return;
  if (tab === 'login') {
    w.innerHTML = `<div class="mini-form">
      <div class="form-group"><label class="form-label">E-mail</label><input class="form-input" type="email" placeholder="your@email.com"></div>
      <div class="form-group" style="margin-bottom:.65rem"><label class="form-label">รหัสผ่าน</label><input class="form-input" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block"><i class="ti ti-login"></i> เข้าสู่ระบบ</button>
    </div>`;
  } else {
    w.innerHTML = `<div class="mini-form">
      <div class="form-row"><div class="form-group"><label class="form-label">ชื่อ</label><input class="form-input" placeholder="ชื่อจริง"></div><div class="form-group"><label class="form-label">นามสกุล</label><input class="form-input" placeholder="นามสกุล"></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">ชื่อเล่น</label><input class="form-input" placeholder="ชื่อเล่น"></div><div class="form-group"><label class="form-label">เพศ</label><select class="form-select"><option>ชาย</option><option>หญิง</option><option>LGBTQ+</option><option>ไม่ระบุ</option></select></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">E-mail</label><input class="form-input" type="email" placeholder="your@email.com"></div><div class="form-group"><label class="form-label">เบอร์โทร</label><input class="form-input" placeholder="08X-XXX-XXXX"></div></div>
      <div class="form-group" style="margin-bottom:.5rem"><label class="form-label">รหัสผ่าน</label><input class="form-input" type="password" placeholder="อย่างน้อย 8 ตัวอักษร"></div>
      <div class="form-group" style="margin-bottom:.65rem"><label class="form-label">ความสนใจ (ไม่บังคับ)</label><div class="interest-grid">${INTERESTS.map(t=>`<button type="button" class="interest-chip" onclick="this.classList.toggle('selected')">${t}</button>`).join('')}</div></div>
      <button class="btn btn-primary btn-block"><i class="ti ti-user-plus"></i> สร้างบัญชี TCOS</button>
    </div>`;
  }
}

/* ── Helpers ─────────────────────────────── */
function toggleUser() {
  isLoggedIn = !isLoggedIn;
  document.getElementById('devBadge').textContent = isLoggedIn ? 'ล็อกอินแล้ว' : 'Guest';
  render();
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeIfBg(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal('eventModal'); document.getElementById('qrFull').classList.remove('open'); }
});

render();
</script>
